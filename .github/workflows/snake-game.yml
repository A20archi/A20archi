name: Snake Game from GitHub Contributions

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate_snake:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate Snake Game
        uses: Platane/snk@v3.3.0
        with:
          username: A20archi
          output: snake.gif
